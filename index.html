<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradingLab — Position Size Calculator</title>

<style>
body{
margin:0;
padding:20px;
background:#0b1220;
font-family:Arial,sans-serif;
color:#fff;
}

.container{
max-width:480px;
margin:auto;
padding:24px;
background:#111827;
border-radius:16px;
}

h1{
margin:0;
font-size:32px;
text-align:center;
}

.subtitle{
text-align:center;
color:#94a3b8;
margin:8px 0 24px;
}

label{
display:block;
margin:12px 0 6px;
font-size:14px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
background:#1e293b;
color:white;
box-sizing:border-box;
}

button{
width:100%;
margin-top:20px;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
background:#2563eb;
color:white;
cursor:pointer;
}

.result{
margin-top:20px;
padding:18px;
text-align:center;
font-size:28px;
background:#1e293b;
border-radius:12px;
}

.footer{
margin-top:20px;
text-align:center;
font-size:12px;
color:#64748b;
}
</style>
</head>

<body>

<div class="container">

<h1>TradingLab</h1>

<div class="subtitle">
Free Position Size Calculator for Traders
</div>

<label>Account Balance ($)</label>
<input id="balance" type="number" placeholder="1000">

<label>Risk Per Trade (%)</label>
<input id="risk" type="number" placeholder="1">

<label>Stop Loss (Pips)</label>
<input id="stoploss" type="number" placeholder="50">

<button onclick="calculateLotSize()">
Calculate
</button>

<div class="result" id="result">
0.00 Lots
</div>

<div class="footer">
tradinglab.click
</div>

</div>

<script>
function calculateLotSize(){

const balance =
parseFloat(document.getElementById("balance").value);

const risk =
parseFloat(document.getElementById("risk").value);

const stoploss =
parseFloat(document.getElementById("stoploss").value);

if(!balance || !risk || !stoploss){
document.getElementById("result").innerHTML = "Fill all fields";
return;
}

const riskAmount = balance * risk / 100;

const lotSize = riskAmount / (stoploss * 10);

document.getElementById("result").innerHTML =
lotSize.toFixed(2) + " Lots";

}
</script>

</body>
</html>
