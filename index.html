<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingLab - Position Size Calculator</title>

  <style>
    body{
      margin:0;
      background:#0f172a;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .box{
      background:#111827;
      padding:30px;
      border-radius:16px;
      width:350px;
    }

    h1{
      text-align:center;
      margin-bottom:10px;
    }

    p{
      text-align:center;
      color:#94a3b8;
      margin-bottom:25px;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border:none;
      border-radius:8px;
      background:#1e293b;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    .result{
      margin-top:20px;
      text-align:center;
      font-size:22px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>TradingLab</h1>

  <p>Position Size Calculator</p>

  <input type="number" id="balance" placeholder="Account Balance">

  <input type="number" id="risk" placeholder="Risk %">

  <input type="number" id="stop" placeholder="Stop Loss (Pips)">

  <button onclick="calc()">Calculate</button>

  <div class="result" id="result">
    0.00 Lots
  </div>

</div>

<script>

function calc(){

  let balance =
    parseFloat(document.getElementById("balance").value);

  let risk =
    parseFloat(document.getElementById("risk").value);

  let stop =
    parseFloat(document.getElementById("stop").value);

  if(!balance || !risk || !stop){
    alert("Fill all fields");
    return;
  }

  let riskMoney =
    balance * (risk / 100);

  let lot =
    riskMoney / (stop * 10);

  document.getElementById("result").innerHTML =
    lot.toFixed(2) + " Lots";

}

</script>

</body>
</html>
